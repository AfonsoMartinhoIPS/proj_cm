version: '3.8'

services:
  firebase:
    image: node:18
    working_dir: /app
    volumes:
      - .:/app
    ports:
      - "4000:4000"   # Emulator UI
      - "8080:8080"   # Firestore
      - "9099:9099"   # Auth
      - "5001:5001"   # Functions
    command: >
      sh -c "npm install -g firebase-tools &&
             firebase emulators:start --only firestore,auth --project demo-project"